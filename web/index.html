<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豬豬顧問</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="masthead">
    <img class="pig" src="pig.svg" alt="">
    <h1>豬豬顧問</h1>
    <p id="sourceLabel">載入中…</p>
  </header>

  <div id="banner" role="status"></div>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" role="tab" aria-selected="true" data-tab="consult">疾病諮詢</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="health">生產健檢</button>
  </nav>

  <!-- ── 疾病諮詢 ── -->
  <section id="panel-consult" class="panel" role="tabpanel">
    <div class="card">
      <label class="field-label" for="question">描述症狀或問題</label>
      <textarea id="question" rows="3"
        placeholder="例如:保育豬咳嗽喘氣、母豬產後不吃東西"></textarea>
      <div class="chips" id="examples">
        <button class="chip" data-q="小豬下痢要用甚麼藥">小豬下痢</button>
        <button class="chip" data-q="保育豬咳嗽喘氣可能是什麼病">保育豬咳嗽</button>
        <button class="chip" data-q="母豬產後不吃東西怎麼辦">母豬產後不吃</button>
        <button class="chip" data-q="豬隻皮膚出現紅色斑點是什麼問題">皮膚紅斑</button>
      </div>
      <button class="btn-primary" id="askBtn">詢問顧問</button>
      <p class="hint" id="askHint">
        可以接續追問,顧問會記得這次瀏覽期間的前 20 則對話(關閉分頁即清除)。
        回答約需 20 秒,會逐段出現。
      </p>
    </div>

    <div id="consultResult">
      <div class="empty-state">
        <img class="pig-empty" src="pig.svg" alt="">
        <p>描述症狀後,顧問會給出可能病因、用藥方向與風險評估。</p>
      </div>
    </div>
  </section>

  <!-- ── 生產健檢 ── -->
  <section id="panel-health" class="panel is-hidden" role="tabpanel">
    <div class="card">
      <div class="card-head">
        <div>
          <h2>輸入本場生產數字</h2>
          <p class="hint">只填知道的項目即可,沒填的不會評級。</p>
        </div>
        <button class="btn-ghost" id="loadExample">載入範例資料</button>
      </div>
      <div id="metricFields" class="fields"></div>
      <button class="btn-primary" id="gradeBtn">開始健檢</button>
      <p class="hint">健檢為純計算,不需連線 AI,額度用盡時仍可使用。</p>
    </div>

    <div id="healthResult">
      <div class="empty-state">
        <img class="pig-empty" src="pig.svg" alt="">
        <p>填好數字按「開始健檢」,或先載入範例看看結果長什麼樣。</p>
      </div>
    </div>
  </section>

  <footer>
    <img class="pig-mini" src="pig.svg" alt="">
    <p id="disclaimer"></p>
    <p>本工具僅供參考,非執業獸醫處方。實際確診與用藥請諮詢當地執業獸醫師。</p>
  </footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
